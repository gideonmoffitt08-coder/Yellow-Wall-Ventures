<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" role="img" aria-label="Yellow Wall Ventures">
  <title>Yellow Wall Ventures</title>
  <!-- 4x4 grid of squares in varying yellow tones -->
  <g>
    <!-- Row 1 -->
    <rect x="40"  y="40"  width="48" height="48" rx="6" fill="#F5C518"/>
    <rect x="100" y="40"  width="48" height="48" rx="6" fill="#D9A300"/>
    <rect x="160" y="40"  width="48" height="48" rx="6" fill="#F8D34A"/>
    <rect x="220" y="40"  width="48" height="48" rx="6" fill="#FBE38A"/>
    <!-- Row 2 -->
    <rect x="40"  y="100" width="48" height="48" rx="6" fill="#FBE38A"/>
    <rect x="100" y="100" width="48" height="48" rx="6" fill="#F5C518"/>
    <rect x="160" y="100" width="48" height="48" rx="6" fill="#D9A300"/>
    <rect x="220" y="100" width="48" height="48" rx="6" fill="#F8D34A"/>
    <!-- Row 3 -->
    <rect x="40"  y="160" width="48" height="48" rx="6" fill="#D9A300"/>
    <rect x="100" y="160" width="48" height="48" rx="6" fill="#F8D34A"/>
    <rect x="160" y="160" width="48" height="48" rx="6" fill="#F5C518"/>
    <rect x="220" y="160" width="48" height="48" rx="6" fill="#FBE38A"/>
    <!-- Row 4 -->
    <rect x="40"  y="220" width="48" height="48" rx="6" fill="#F8D34A"/>
    <rect x="100" y="220" width="48" height="48" rx="6" fill="#FBE38A"/>
    <rect x="160" y="220" width="48" height="48" rx="6" fill="#F5C518"/>
    <rect x="220" y="220" width="48" height="48" rx="6" fill="#D9A300"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" letter-spacing="2">
    <text x="320" y="140" font-size="86" fill="#0A0A0A">YELLOW</text>
    <text x="320" y="220" font-size="86" fill="#F5C518">WALL</text>
  </g>
  <text x="322" y="262" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" letter-spacing="8" fill="#9A9A9A">VENTURES</text>
</svg>
